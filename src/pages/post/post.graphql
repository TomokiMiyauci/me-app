query PostBySlug($slug: String!, $lang: String!) {
  posts(where: { AND: [
     {slug: { eq: $slug }}, 
     {language: { eq: $lang }}
  ]  }) {
    ...PostMeta
    title
    description
    publishedAt: publishedAt
    modifiedAt: modifiedAt
    body
    tags {
      name
    }
  }
}

query AllPosts {
  posts {
    slug
    language
    id
  }
}
