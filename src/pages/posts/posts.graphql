query BlogByLang($lang: String!) {
  blogs: blogConnection(filter: { language: { eq: $lang } }) {
    edges {
      node {
        ...PostsMeta
      }
    }
  }
}

query ArticlesByLang($lang: String!) {
  articles: postConnection(
    filter: { language: { eq: $lang } }
    sort: "published_at"
  ) {
    edges {
      node {
        ...Article
        key: id
        slug
      }
    }
  }
}
