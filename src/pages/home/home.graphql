query Blog($lang: String!) {
  allBlog: blogConnection(filter: { language: { eq: $lang } }) {
    edges {
      node {
        title
        description
        coverImage: cover_image
      }
    }
  }
}

query HomeByLang($lang: String!) {
  home: homeConnection(filter: { language: { eq: $lang } }) {
    edges {
      node {
        ...HomeMeta
      }
    }
  }
}
