on:
  push:
    branches:
      - main

jobs:
  build:
    uses: ./.github/workflows/build.yml

  deploy:
    needs: build
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - environment: staging
            prod: false
          - environment: production
            prod: true

    environment:
      name: ${{ matrix.environment }}

    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v5

      - uses: denoland/setup-deno@v2
        with:
          cache: true

      - run: deno install

      - name: Download artifact
        id: download-artifact
        uses: actions/download-artifact@v7
        with:
          artifact-ids: ${{ needs.build.outputs.artifact-id }}
          path: dist

      - name: Upload Version
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: versions upload --name ${{ vars.WORKER_NAME }}

      - name: Get Latest Version ID
        id: version_list
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: versions list --name ${{ vars.WORKER_NAME }} --json

      - name: Parse Id
        id: list_parser
        env:
          RAW_JSON: ${{ steps.version_list.outputs.command-output }}
        run: |
          LAST_ID=$(echo "$RAW_JSON" | jq -r '.[-1].id')

          echo "id=$LAST_ID" >> $GITHUB_OUTPUT

      - name: Deploy
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: versions deploy ${{ steps.list_parser.outputs.id }}@100% --name ${{ vars.WORKER_NAME }} -y

  publish:
    needs: [build, deploy]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Generate Token
        id: app-token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.BOT_APP_ID }}
          private-key: ${{ secrets.BOT_PRIVATE_KEY }}

      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Download artifact
        uses: actions/download-artifact@v6
        with:
          artifact-ids: ${{ needs.build.outputs.artifact-id }}
          path: dist

      - name: Zip artifact
        run: zip -r dist.zip dist/*

      - uses: cycjimmy/semantic-release-action@v5
        env:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}
